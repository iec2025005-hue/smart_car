; ──────────────────────────────────────────────────
;   Smart Car Swerve Drive "Spinal Cord"
;   Architecture: ESP32
;   Motors: 4x Stepper (Steer), 4x DC Encoder (Drive)
; ──────────────────────────────────────────────────

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ── Upload via USB directly ──
upload_speed = 921600
monitor_speed = 115200

; ── High-Performance Libraries ──
lib_deps = 
	gin66/FastAccelStepper @ ^0.30.15      ; Hardware-accelerated Stepper Control
	madhephaestus/ESP32Encoder @ ^0.11.6   ; Hardware-accelerated Encoder Counting
